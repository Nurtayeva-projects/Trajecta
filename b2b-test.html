<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оценка сотрудника - Trajecta B2B</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23020617'/><text x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='Arial Black' font-weight='900' font-size='20' fill='%23C6FF00'>T</text></svg>">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#020617;--card:#0d1b35;--card2:#111f3a;
      --accent:#C6FF00;--ad:rgba(198,255,0,.1);--am:rgba(198,255,0,.22);
      --blue:rgba(96,165,250,.9);--bd:rgba(96,165,250,.12);--bm:rgba(96,165,250,.25);
      --purple:rgba(167,139,250,.9);--pd:rgba(167,139,250,.12);--pm:rgba(167,139,250,.25);
      --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
      --text:#f0f4ff;--muted:rgba(240,244,255,.52);--dim:rgba(240,244,255,.22);
      --D:'Syne',sans-serif;--B:'Space Grotesk',sans-serif;
    }
    body{background:var(--bg);color:var(--text);font-family:var(--B);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
    .bg-g{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(167,139,250,.06),transparent 55%);}
    header{display:flex;align-items:center;padding:0 40px;height:64px;border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(2,6,23,.9);backdrop-filter:blur(20px);}
    .logo{font-family:var(--D);font-size:1.3rem;font-weight:800;}
    .logo span{color:var(--accent);}
    .prog{position:fixed;top:64px;left:0;right:0;height:3px;background:rgba(255,255,255,.06);z-index:99;}
    .prog-f{height:100%;background:linear-gradient(90deg,rgba(167,139,250,.9),var(--accent));transition:width .6s cubic-bezier(.4,0,.2,1);}
    main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:84px 20px 60px;}

    /* PHASE BANNER */
    .phase-banner{width:100%;max-width:640px;border-radius:14px;padding:14px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px;font-size:.88rem;font-weight:600;}
    .phase-1{background:rgba(167,139,250,.08);border:1px solid var(--pm);color:var(--purple);}
    .phase-2{background:var(--bd);border:1px solid var(--bm);color:var(--blue);}
    .phase-ico{font-size:1.2rem;}

    /* PROGRESS DOTS */
    .qdots{display:flex;gap:5px;width:100%;max-width:640px;margin-bottom:10px;}
    .qd{height:4px;border-radius:2px;flex:1;background:var(--border);transition:all .4s;}
    .qd.done{background:rgba(167,139,250,.5);}
    .qd.active{background:rgba(167,139,250,.9);}
    .qd.done2{background:rgba(96,165,250,.5);}
    .qd.active2{background:rgba(96,165,250,.9);}

    /* QUESTION CARD */
    .qwrap{width:100%;max-width:640px;}
    .qcard{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 28px 22px;position:relative;overflow:hidden;}
    .qcard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,rgba(167,139,250,.8),transparent 60%);}
    .qcard.phase2::before{background:linear-gradient(90deg,rgba(96,165,250,.8),transparent 60%);}
    @keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
    .qcard.in{animation:slideIn .35s cubic-bezier(.34,1.2,.64,1) both;}
    .qtag{display:inline-flex;align-items:center;gap:6px;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.2);color:rgba(167,139,250,.9);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:100px;margin-bottom:14px;}
    .qtag.t2{background:var(--bd);border-color:var(--bm);color:var(--blue);}
    .qnum{position:absolute;top:20px;right:24px;font-family:var(--D);font-size:3.5rem;font-weight:800;color:rgba(255,255,255,.04);line-height:1;}
    .qtext{font-family:var(--D);font-size:clamp(1.1rem,2.5vw,1.4rem);font-weight:800;letter-spacing:-.025em;line-height:1.25;margin-bottom:20px;padding-right:40px;}
    .opts{display:flex;flex-direction:column;gap:8px;}
    .opt{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.03);border:1.5px solid var(--border);border-radius:12px;padding:13px 16px;cursor:pointer;transition:all .2s;text-align:left;width:100%;font-family:var(--B);}
    .opt:hover{border-color:rgba(167,139,250,.35);background:rgba(167,139,250,.06);transform:translateY(-2px);}
    .opt.phase2:hover{border-color:rgba(96,165,250,.35);background:rgba(96,165,250,.06);}
    .opt.selected{border-color:rgba(167,139,250,.6);background:rgba(167,139,250,.1);}
    .opt.selected.phase2{border-color:rgba(96,165,250,.6);background:rgba(96,165,250,.1);}
    .okey{width:28px;height:28px;border-radius:7px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-family:var(--D);font-weight:800;font-size:.75rem;flex-shrink:0;transition:all .2s;}
    .opt.selected .okey{background:rgba(167,139,250,.25);color:rgba(167,139,250,1);}
    .opt.selected.phase2 .okey{background:rgba(96,165,250,.25);color:rgba(96,165,250,1);}
    .oval{font-size:.9rem;font-weight:500;color:var(--text);}
    .hint{font-size:.78rem;color:rgba(255,100,100,.7);text-align:center;min-height:18px;margin-top:8px;opacity:0;transition:opacity .3s;}
    .hint.show{opacity:1;}
    .qnav{width:100%;max-width:640px;display:flex;gap:10px;margin-top:12px;}
    .btn-back{width:48px;height:48px;background:var(--card);border:1px solid var(--border2);border-radius:10px;color:var(--muted);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
    .btn-back:hover:not(:disabled){border-color:rgba(255,255,255,.22);color:var(--text);}
    .btn-back:disabled{opacity:.25;cursor:not-allowed;}
    .btn-next{flex:1;height:48px;background:rgba(167,139,250,.9);color:#020617;font-family:var(--B);font-weight:700;font-size:.95rem;border:none;border-radius:10px;cursor:pointer;transition:transform .2s,box-shadow .2s;}
    .btn-next:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(167,139,250,.4);}
    .btn-next.phase2{background:rgba(96,165,250,.9);}
    .btn-next.phase2:hover{box-shadow:0 8px 28px rgba(96,165,250,.4);}

    /* ANALYZING SCREEN */
    .analyzing{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;opacity:0;pointer-events:none;transition:opacity .4s;}
    .analyzing.show{opacity:1;pointer-events:all;}
    .analyzing-logo{font-family:var(--D);font-size:1.8rem;font-weight:800;}
    .analyzing-logo span{color:var(--accent);}
    .ai-spinner{width:56px;height:56px;border-radius:50%;border:3px solid rgba(198,255,0,.1);border-top-color:var(--accent);animation:spin 1s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .analyzing-title{font-family:var(--D);font-size:1.2rem;font-weight:800;text-align:center;}
    .analyzing-sub{font-size:.88rem;color:var(--muted);text-align:center;max-width:300px;line-height:1.6;}
    .analyzing-steps{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
    .astep{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted);}
    .astep.done{color:var(--accent);}
    .astep-dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0;}
    .astep.done .astep-dot{background:var(--accent);}

    @media(max-width:640px){
      header{padding:0 16px;}
      main{padding:76px 12px 40px;}
      .qcard{padding:20px 16px 16px;}
      .qtext{font-size:1rem;}
    }
  </style>
</head>
<body>
<div class="bg-g"></div>

<!-- ANALYZING SCREEN -->
<div class="analyzing" id="analyzing">
  <div class="analyzing-logo">Traject<span>a</span></div>
  <div class="ai-spinner"></div>
  <div class="analyzing-title">AI анализирует результаты...</div>
  <div class="analyzing-sub">Claude обрабатывает твои ответы и составляет профиль</div>
  <div class="analyzing-steps">
    <div class="astep" id="as1"><div class="astep-dot"></div>Анализ психологического состояния</div>
    <div class="astep" id="as2"><div class="astep-dot"></div>Определение психотипа</div>
    <div class="astep" id="as3"><div class="astep-dot"></div>Оценка потенциала роста</div>
    <div class="astep" id="as4"><div class="astep-dot"></div>Формирование рекомендаций для HR</div>
  </div>
</div>

<header>
  <div class="logo">Traject<span>a</span></div>
  <div style="margin-left:12px;font-size:.75rem;color:var(--muted)" id="company-label"></div>
  <div style="margin-left:auto;font-size:.78rem;color:var(--muted)">Вопрос <span id="qnum-h">1</span> из 10</div>
</header>
<div class="prog"><div class="prog-f" id="prog-f" style="width:0%"></div></div>

<main>
  <div class="qdots" id="qdots"></div>
  <div class="phase-banner phase-1" id="phase-banner">
    <span class="phase-ico">🧠</span>
    <div>
      <div style="font-size:.65rem;opacity:.7;text-transform:uppercase;letter-spacing:.08em">Часть 1 из 2</div>
      <div>Психологическое состояние</div>
    </div>
  </div>
  <div class="qwrap" id="qwrap"></div>
  <div class="hint" id="hint">👆 Выбери один вариант</div>
  <div class="qnav">
    <button class="btn-back" id="btn-back" onclick="prev()" disabled>←</button>
    <button class="btn-next" id="btn-next" onclick="next()">Следующий →</button>
  </div>
</main>

<script>
  const B2B_WEBHOOK = 'https://hook.eu1.make.com/fmphpccbshx83909g7w7cnrghvnr3zcq';

  const params = new URLSearchParams(window.location.search);
  const company = decodeURIComponent(params.get('company')||'');
  const companyId = params.get('id')||'';
  const empData = JSON.parse(localStorage.getItem('tr_b2b_employee')||'{}');

  if(company) document.getElementById('company-label').textContent = '🏢 ' + company;

  // ── QUESTIONS ──
  const QS = [
    // PHASE 1: Психологическое состояние
    {
      phase:1, tag:'⚡ Энергия', num:'01',
      text:'Как ты обычно чувствуешь себя к середине рабочего дня?',
      opts:[
        {key:'A', val:'Полон энергии — время летит незаметно', score:{energy:4,burnout:0}},
        {key:'B', val:'Нормально, но к вечеру устаю', score:{energy:3,burnout:1}},
        {key:'C', val:'Часто жду конца дня', score:{energy:1,burnout:3}},
        {key:'D', val:'Работаю на автопилоте — эмоций почти нет', score:{energy:0,burnout:4}},
      ]
    },
    {
      phase:1, tag:'💡 Смысл', num:'02',
      text:'Когда коллега спрашивает чем ты занимаешься — что ты чувствуешь?',
      opts:[
        {key:'A', val:'Горжусь и охотно рассказываю', score:{meaning:4,risk:0}},
        {key:'B', val:'Объясняю нейтрально — работа как работа', score:{meaning:2,risk:1}},
        {key:'C', val:'Немного уклоняюсь — сложно объяснить ценность', score:{meaning:1,risk:2}},
        {key:'D', val:'Сам не до конца понимаю зачем это делаю', score:{meaning:0,risk:4}},
      ]
    },
    {
      phase:1, tag:'👥 Команда', num:'03',
      text:'Представь что тебе нужна помощь коллеги в сложной задаче. Что происходит?',
      opts:[
        {key:'A', val:'Легко прошу — знаю что помогут', score:{team:4,risk:0}},
        {key:'B', val:'Прошу но чувствую что обременяю', score:{team:2,risk:1}},
        {key:'C', val:'Стараюсь справиться сам', score:{team:1,risk:2}},
        {key:'D', val:'Обращаться не к кому — каждый сам по себе', score:{team:0,risk:3}},
      ]
    },
    {
      phase:1, tag:'⚠️ Выгорание', num:'04',
      text:'Как давно ты последний раз по-настоящему отдыхал от работы?',
      opts:[
        {key:'A', val:'Недавно — умею переключаться', score:{burnout:0,energy:3}},
        {key:'B', val:'Месяц-два назад', score:{burnout:1,energy:2}},
        {key:'C', val:'Трудно вспомнить — давно', score:{burnout:3,energy:1}},
        {key:'D', val:'Работа везде со мной — не выключаюсь', score:{burnout:4,energy:0}},
      ]
    },
    {
      phase:1, tag:'🚪 Риск ухода', num:'05',
      text:'Если бы тебе сегодня предложили такую же зарплату в другой компании — ушёл бы?',
      opts:[
        {key:'A', val:'Нет — мне здесь нравится', score:{risk:0,loyalty:4}},
        {key:'B', val:'Зависит от компании и условий', score:{risk:1,loyalty:2}},
        {key:'C', val:'Скорее да — давно думаю об этом', score:{risk:3,loyalty:1}},
        {key:'D', val:'Да, без долгих раздумий', score:{risk:4,loyalty:0}},
      ]
    },
    // PHASE 2: Психотип и потенциал
    {
      phase:2, tag:'🎯 Решения', num:'06',
      text:'Тебе дают новый сложный проект без чёткого ТЗ. Твои первые действия?',
      opts:[
        {key:'A', val:'Собираю данные — изучаю всё что есть перед стартом', score:{type:'A',potential:3}},
        {key:'B', val:'Строю структуру и план — хаос мешает работать', score:{type:'B',potential:4}},
        {key:'C', val:'Обсуждаю с командой — вместе быстрее разберёмся', score:{type:'C',potential:3}},
        {key:'D', val:'Сразу начинаю делать — по ходу разберусь', score:{type:'D',potential:4}},
      ]
    },
    {
      phase:2, tag:'⚡ Мотивация', num:'07',
      text:'Что заставляет тебя выкладываться больше всего?',
      opts:[
        {key:'A', val:'Сложные задачи где нужно разобраться до конца', score:{type:'A',potential:4}},
        {key:'B', val:'Возможность выстроить что-то большое и важное', score:{type:'B',potential:4}},
        {key:'C', val:'Когда вижу что помогаю людям и меня ценят', score:{type:'C',potential:3}},
        {key:'D', val:'Конкретный результат — сделал, закрыл, двигаюсь дальше', score:{type:'D',potential:3}},
      ]
    },
    {
      phase:2, tag:'📈 Рост', num:'08',
      text:'Тебе предлагают взять новую роль — выше текущего уровня. Твоя реакция?',
      opts:[
        {key:'A', val:'Берусь — это шанс вырасти, разберусь по ходу', score:{growth:4,potential:4}},
        {key:'B', val:'Соглашусь если есть чёткий план и поддержка', score:{growth:3,potential:3}},
        {key:'C', val:'Попрошу время — хочу взвесить все риски', score:{growth:2,potential:3}},
        {key:'D', val:'Скорее откажусь — комфортнее на знакомой территории', score:{growth:1,potential:2}},
      ]
    },
    {
      phase:2, tag:'🔭 Цели', num:'09',
      text:'Где ты видишь себя через 2 года?',
      opts:[
        {key:'A', val:'На более высокой позиции — хочу расти вертикально', score:{growth:4,ambition:4}},
        {key:'B', val:'Глубже в экспертизе — стать лучшим в своём деле', score:{growth:3,ambition:3}},
        {key:'C', val:'Возможно в другой роли или компании', score:{growth:2,ambition:2}},
        {key:'D', val:'Честно — ещё не думал об этом', score:{growth:1,ambition:1}},
      ]
    },
    {
      phase:2, tag:'💎 Стиль', num:'10',
      text:'Коллеги описывают тебя как человека который...',
      opts:[
        {key:'A', val:'Всегда думает перед тем как сделать — надёжный', score:{type:'A',potential:3}},
        {key:'B', val:'Видит картину целиком — стратег', score:{type:'B',potential:4}},
        {key:'C', val:'Умеет договориться с любым человеком', score:{type:'C',potential:3}},
        {key:'D', val:'Просто берёт и делает — не тормозит', score:{type:'D',potential:4}},
      ]
    },
  ];

  let cur = 0;
  const answers = {};

  // Init dots
  const dotsEl = document.getElementById('qdots');
  QS.forEach((q,i)=>{
    const d = document.createElement('div');
    d.className='qd'; d.id='qd'+i;
    dotsEl.appendChild(d);
  });

  function render(){
    const q = QS[cur];
    const phase2 = q.phase===2;
    const wrap = document.getElementById('qwrap');

    wrap.innerHTML = `<div class="qcard ${phase2?'phase2':''} in">
      <div class="qnum">${q.num}</div>
      <div class="qtag ${phase2?'t2':''}">${q.tag}</div>
      <div class="qtext">${q.text}</div>
      <div class="opts">
        ${q.opts.map((o,i)=>`
          <button class="opt ${phase2?'phase2':''} ${answers[cur]===i?'selected':''}" onclick="pick(${cur},${i})">
            <div class="okey">${o.key}</div>
            <div class="oval">${o.val}</div>
          </button>`).join('')}
      </div>
    </div>`;

    // Phase banner
    const banner = document.getElementById('phase-banner');
    if(phase2){
      banner.className='phase-banner phase-2';
      banner.innerHTML='<span class="phase-ico">🚀</span><div><div style="font-size:.65rem;opacity:.7;text-transform:uppercase;letter-spacing:.08em">Часть 2 из 2</div><div>Психотип и потенциал</div></div>';
    } else {
      banner.className='phase-banner phase-1';
      banner.innerHTML='<span class="phase-ico">🧠</span><div><div style="font-size:.65rem;opacity:.7;text-transform:uppercase;letter-spacing:.08em">Часть 1 из 2</div><div>Психологическое состояние</div></div>';
    }

    document.getElementById('qnum-h').textContent = cur+1;
    document.getElementById('prog-f').style.width = Math.round(((cur+1)/10)*100)+'%';
    document.getElementById('btn-back').disabled = cur===0;
    document.getElementById('btn-next').textContent = cur===9?'Получить результат →':'Следующий →';
    document.getElementById('btn-next').className = 'btn-next'+(phase2?' phase2':'');
    document.getElementById('hint').classList.remove('show');

    QS.forEach((_,i)=>{
      const d = document.getElementById('qd'+i);
      if(!d) return;
      const isP2 = QS[i].phase===2;
      if(i<cur) d.className='qd '+(isP2?'done2':'done');
      else if(i===cur) d.className='qd '+(isP2?'active2':'active');
      else d.className='qd';
    });
  }

  function pick(qIdx, optIdx){
    answers[qIdx] = optIdx;
    document.querySelectorAll('.opt').forEach((el,i)=>{
      el.classList.toggle('selected', i===optIdx);
    });
    document.getElementById('hint').classList.remove('show');
  }

  function next(){
    if(answers[cur]===undefined){ document.getElementById('hint').classList.add('show'); return; }
    if(cur===9){ finish(); return; }
    cur++; render();
  }

  function prev(){ if(cur===0)return; cur--; render(); }

  async function finish(){
    // Show analyzing screen
    const analyzing = document.getElementById('analyzing');
    analyzing.classList.add('show');

    // Animate steps
    const steps = ['as1','as2','as3','as4'];
    for(let i=0;i<steps.length;i++){
      await new Promise(r=>setTimeout(r,800));
      document.getElementById(steps[i]).classList.add('done');
    }

    // Build answers summary for AI
    const answersSummary = QS.map((q,i)=>{
      const optIdx = answers[i];
      const opt = q.opts[optIdx];
      return `Вопрос ${q.num} (${q.tag}): ${q.text}\nОтвет: ${opt?opt.val:'—'}`;
    }).join('\n\n');

    const employeeName = empData.name || 'Сотрудник';
    const employeeRole = empData.role || 'Не указана';

    // Call Claude API
    let aiResult = null;
    try{
      const response = await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:1000,
          messages:[{
            role:'user',
            content:`Ты HR-аналитик платформы Trajecta. Проанализируй ответы сотрудника и верни ТОЛЬКО JSON без markdown.

Сотрудник: ${employeeName}
Должность: ${employeeRole}

Ответы на тест:
${answersSummary}

  function calcFallback(){
    // Calculate scores from answers
    let burnout=0, risk=0, growth=0, typeScores={A:0,B:0,C:0,D:0};
    QS.forEach((q,i)=>{
      const opt = q.opts[answers[i]||0];
      if(!opt) return;
      const s = opt.score;
      if(s.burnout) burnout+=s.burnout;
      if(s.risk) risk+=s.risk;
      if(s.growth) growth+=s.growth;
      if(s.type) typeScores[s.type]=(typeScores[s.type]||0)+1;
    });
    const topType = Object.entries(typeScores).sort((a,b)=>b[1]-a[1])[0][0];
    const typeNames = {A:'Аналитик',B:'Архитектор',C:'Коммуникатор',D:'Исполнитель'};
    const potential = Math.max(20, Math.min(95, 70 - burnout*3 + growth*4 - risk*2));
    return {
      psychotype: typeNames[topType]||'Исполнитель',
      psychotype_code: topType,
      potential_score: potential,
      burnout_risk: burnout>=8?'Высокий':burnout>=4?'Средний':'Низкий',
      departure_risk: risk>=8?'Высокий':risk>=4?'Средний':'Низкий',
      growth_readiness: growth>=6?'Готов к росту':growth>=3?'Стабилен':'Требует внимания',
      state: 'Анализ выполнен на основе ответов теста',
      insight: 'Сотрудник показал характерный профиль '+typeNames[topType]+'. Рекомендуется детальная беседа с руководителем.',
      recommendation: 'Обратите внимание на уровень мотивации и нагрузку сотрудника.',
      strengths: ['Профессионализм','Опыт','Вовлечённость'],
      risks: ['Возможное выгорание','Требует внимания руководства']
    };
  }
