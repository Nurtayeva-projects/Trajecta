<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Твой профиль — Trajecta B2B</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23020617'/><text x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='Arial Black' font-weight='900' font-size='20' fill='%23C6FF00'>T</text></svg>">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#020617;--card:#0d1b35;--accent:#C6FF00;--ad:rgba(198,255,0,.1);--am:rgba(198,255,0,.22);--blue:rgba(96,165,250,.9);--bd:rgba(96,165,250,.12);--bm:rgba(96,165,250,.25);--purple:rgba(167,139,250,.9);--pd:rgba(167,139,250,.12);--pm:rgba(167,139,250,.25);--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);--text:#f0f4ff;--muted:rgba(240,244,255,.52);--dim:rgba(240,244,255,.22);--D:'Syne',sans-serif;--B:'Space Grotesk',sans-serif;}
    body{background:var(--bg);color:var(--text);font-family:var(--B);min-height:100vh;padding:32px 20px 60px;-webkit-font-smoothing:antialiased;}
    .bg-g{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(167,139,250,.06),transparent 55%);}
    .wrap{max-width:560px;margin:0 auto;position:relative;z-index:1;}
    .logo{font-family:var(--D);font-size:1.2rem;font-weight:800;margin-bottom:24px;display:block;}
    .logo span{color:var(--accent);}
    .hero-card{background:linear-gradient(135deg,rgba(167,139,250,.1),rgba(167,139,250,.04));border:1.5px solid rgba(167,139,250,.25);border-radius:20px;padding:28px 24px;margin-bottom:16px;text-align:center;}
    .psycho-ico{font-size:3rem;margin-bottom:12px;}
    .psycho-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:rgba(167,139,250,.7);margin-bottom:6px;}
    .psycho-name{font-family:var(--D);font-size:1.8rem;font-weight:800;letter-spacing:-.03em;margin-bottom:6px;}
    .psycho-line{font-size:.9rem;color:var(--muted);}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;}
    .card-title{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:14px;}
    .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
    .metric{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
    .metric-val{font-family:var(--D);font-size:1.5rem;font-weight:800;margin-bottom:4px;}
    .metric-lbl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;}
    .tag{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:4px 12px;border-radius:100px;}
    .tag-green{background:var(--ad);border:1px solid var(--am);color:var(--accent);}
    .tag-yellow{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.25);color:rgba(251,191,36,.9);}
    .tag-red{background:rgba(255,80,50,.1);border:1px solid rgba(255,80,50,.25);color:rgba(255,120,80,.9);}
    .insight-box{background:rgba(198,255,0,.05);border:1px solid rgba(198,255,0,.2);border-radius:12px;padding:16px;margin-bottom:14px;}
    .insight-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:8px;}
    .insight-text{font-size:.9rem;color:var(--muted);line-height:1.7;}
    .strengths{display:flex;flex-wrap:wrap;gap:7px;}
    .strength{background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.2);color:rgba(167,139,250,.9);font-size:.78rem;font-weight:600;padding:5px 12px;border-radius:100px;}
    .note{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:.82rem;color:var(--muted);line-height:1.6;text-align:center;margin-top:16px;}
  </style>
</head>
<body>
<div class="bg-g"></div>
<div class="wrap">
  <a href="index.html" class="logo">Traject<span>a</span></a>
  <div id="content">
    <div style="text-align:center;padding:60px 0;color:var(--muted)">Загрузка...</div>
  </div>
</div>

<script>
  const PSYCHO_ICO = {A:'🔬',B:'🏗️',C:'🤝',D:'⚡',E:'🚀','Аналитик':'🔬','Архитектор':'🏗️','Коммуникатор':'🤝','Исполнитель':'⚡','Визионер':'🚀'};

  function getRiskTag(val){
    if(!val) return '';
    const v = val.toLowerCase();
    if(v.includes('низ')) return '<span class="tag tag-green">'+val+'</span>';
    if(v.includes('выс')) return '<span class="tag tag-red">'+val+'</span>';
    return '<span class="tag tag-yellow">'+val+'</span>';
  }

  function getGrowthTag(val){
    if(!val) return '';
    if(val.includes('Готов')) return '<span class="tag tag-green">'+val+'</span>';
    if(val.includes('Требует')) return '<span class="tag tag-red">'+val+'</span>';
    return '<span class="tag tag-yellow">'+val+'</span>';
  }

  const R = JSON.parse(localStorage.getItem('tr_b2b_result')||'null');
  if(!R){
    document.getElementById('content').innerHTML='<div style="text-align:center;padding:60px 0"><div style="font-size:2rem;margin-bottom:12px">🔍</div><p style="color:var(--muted)">Результат не найден</p></div>';
  } else {
    const ico = PSYCHO_ICO[R.psychotype_code] || PSYCHO_ICO[R.psychotype] || '🧠';
    const scoreColor = R.potential_score>=75?'var(--accent)':R.potential_score>=50?'var(--blue)':'rgba(255,120,80,.9)';

    document.getElementById('content').innerHTML = `
      <div style="text-align:center;margin-bottom:6px">
        <div style="font-size:.78rem;color:var(--muted)">Привет, <strong style="color:var(--text)">${R.name}</strong> 👋</div>
      </div>

      <div class="hero-card">
        <div class="psycho-ico">${ico}</div>
        <div class="psycho-label">Твой психотип</div>
        <div class="psycho-name">${R.psychotype||'—'}</div>
        <div class="psycho-line">${R.state||''}</div>
      </div>

      <div class="metrics">
        <div class="metric">
          <div class="metric-val" style="color:${scoreColor}">${R.potential_score||0}%</div>
          <div class="metric-lbl">Потенциал</div>
        </div>
        <div class="metric">
          <div class="metric-val" style="font-size:1rem;padding-top:4px">${getGrowthTag(R.growth_readiness)}</div>
          <div class="metric-lbl" style="margin-top:6px">Готовность к росту</div>
        </div>
        <div class="metric">
          <div class="metric-val" style="font-size:1rem;padding-top:4px">${getRiskTag(R.burnout_risk)}</div>
          <div class="metric-lbl" style="margin-top:6px">Риск выгорания</div>
        </div>
        <div class="metric">
          <div class="metric-val" style="font-size:1rem;padding-top:4px">${getRiskTag(R.departure_risk)}</div>
          <div class="metric-lbl" style="margin-top:6px">Риск ухода</div>
        </div>
      </div>

      <div class="insight-box">
        <div class="insight-label">⚡ Главный инсайт</div>
        <div class="insight-text">${R.insight||'—'}</div>
      </div>

      <div class="card">
        <div class="card-title">💪 Твои сильные стороны</div>
        <div class="strengths">
          ${(R.strengths||[]).map(s=>`<span class="strength">${s}</span>`).join('')}
        </div>
      </div>

      <div class="note">
        🔒 Детальный анализ и рекомендации видит только твой HR-менеджер.<br>
        Спасибо что прошёл тест — это помогает строить лучшую команду.
      </div>
    `;
  }
</script>
</body>
</html>
